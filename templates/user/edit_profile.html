{% extends "base.html" %}
{% block title %}Edit Profile - SkillSync{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit Profile</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('profile.edit_profile') }}" enctype="multipart/form-data">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Full Name *</label>
                                    <input type="text" class="form-control" id="name" name="name"
                                           value="{{ user.name }}" required minlength="2">
                                </div>

                                <div class="mb-3">
                                    <label for="bio" class="form-label">Bio</label>
                                    <textarea class="form-control" id="bio" name="bio" rows="4"
                                              placeholder="Tell others about yourself, your experience, and what you're looking for...">{{ user.bio or '' }}</textarea>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="location" class="form-label">Location</label>
                                        <input type="text" class="form-control" id="location" name="location"
                                               value="{{ user.location or '' }}" placeholder="City, Country">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="experience_years" class="form-label">Years of Experience</label>
                                        <input type="number" class="form-control" id="experience_years"
                                               name="experience_years" min="0" max="50"
                                               value="{{ user.experience_years or 0 }}">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="learning_preference" class="form-label">Learning Preference</label>
                                        <select class="form-select" id="learning_preference" name="learning_preference">
                                            <option value="online" {{ 'selected' if user.learning_preference == 'online' }}>Online</option>
                                            <option value="offline" {{ 'selected' if user.learning_preference == 'offline' }}>In-Person</option>
                                            <option value="both" {{ 'selected' if user.learning_preference == 'both' }}>Both</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="availability" class="form-label">Availability</label>
                                        <select class="form-select" id="availability" name="availability">
                                            <option value="" {{ 'selected' if not user.availability }}>Select...</option>
                                            <option value="Weekdays" {{ 'selected' if user.availability == 'Weekdays' }}>Weekdays</option>
                                            <option value="Weekends" {{ 'selected' if user.availability == 'Weekends' }}>Weekends</option>
                                            <option value="Evenings" {{ 'selected' if user.availability == 'Evenings' }}>Evenings</option>
                                            <option value="Flexible" {{ 'selected' if user.availability == 'Flexible' }}>Flexible</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="text-center mb-4">
                                    <label class="form-label d-block">Profile Picture</label>
                                    <div class="mb-3">
                                        {% if user.profile_picture %}
                                            <img src="{{ url_for('static', filename='images/profiles/' + user.profile_picture) }}"
                                                 class="rounded-circle" width="150" height="150"
                                                 style="object-fit:cover;" id="preview" alt="Profile">
                                        {% else %}
                                            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                                                 style="width:150px;height:150px;font-size:4rem;" id="preview-placeholder">
                                                {{ user.name[0].upper() }}
                                            </div>
                                        {% endif %}
                                    </div>
                                    <input type="file" class="form-control" id="profile_picture"
                                           name="profile_picture" accept="image/*"
                                           onchange="previewImage(event)">
                                    <small class="text-muted">JPG, PNG, GIF, WEBP. Max 5MB.</small>
                                </div>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('profile.view_profile') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function previewImage(event) {
    var reader = new FileReader();
    reader.onload = function() {
        var preview = document.getElementById('preview');
        var placeholder = document.getElementById('preview-placeholder');
        if (preview) {
            preview.src = reader.result;
        } else if (placeholder) {
            var img = document.createElement('img');
            img.src = reader.result;
            img.className = 'rounded-circle';
            img.width = 150;
            img.height = 150;
            img.style.objectFit = 'cover';
            img.id = 'preview';
            placeholder.parentNode.replaceChild(img, placeholder);
        }
    };
    reader.readAsDataURL(event.target.files[0]);
}
</script>
{% endblock %}
