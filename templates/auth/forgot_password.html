{% extends "base.html" %}
{% block title %}Forgot Password - SkillSync{% endblock %}

{% block content %}
<div class="py-5" style="background:linear-gradient(135deg,var(--primary) 0%,#7c3aed 50%,var(--secondary) 100%);min-height:80vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-xl" style="border-radius:var(--radius-2xl);">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
                                 style="width:56px;height:56px;border-radius:var(--radius-xl);background:linear-gradient(135deg,var(--primary),var(--secondary));">
                                <i class="bi bi-key text-white fs-4"></i>
                            </div>
                            <h3 class="fw-bold" style="color:var(--gray-900);">Forgot Password?</h3>
                            <p class="text-muted small">Enter your email and we'll send you a reset link</p>
                        </div>

                        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                            <div class="mb-4">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email"
                                       required placeholder="you@example.com">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2.5 mb-3" style="font-size:1rem;">
                                Send Reset Link <i class="bi bi-arrow-right"></i>
                            </button>
                        </form>

                        <div class="text-center">
                            <a href="{{ url_for('auth.login') }}" class="small text-decoration-none" style="color:var(--primary);">
                                <i class="bi bi-arrow-left"></i> Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
