{% extends "base.html" %}
{% block title %}Resend Verification - SkillSync{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-envelope-arrow-up display-3 text-primary"></i>
                        <h2 class="fw-bold mt-3">Resend Verification Email</h2>
                        <p class="text-muted">
                            Enter your email address and we'll send you a new verification link.
                        </p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.resend_verification') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   required placeholder="Enter your email">
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> Send Verification Email
                            </button>
                        </div>
                    </form>

                    <div class="text-center">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none">
                            <i class="bi bi-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
