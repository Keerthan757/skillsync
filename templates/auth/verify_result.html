{% extends "base.html" %}
{% block title %}Verify Email - SkillSync{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    {% if success %}
                        <i class="bi bi-check-circle-fill display-3 text-success"></i>
                        <h2 class="fw-bold mt-3 text-success">Email Verified!</h2>
                        <p class="text-muted">Your email has been verified successfully.</p>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> Log In
                        </a>
                    {% else %}
                        <i class="bi bi-x-circle-fill display-3 text-danger"></i>
                        <h2 class="fw-bold mt-3 text-danger">Verification Failed</h2>
                        <p class="text-muted">{{ message }}</p>
                        <a href="{{ url_for('auth.resend_verification') }}" class="btn btn-primary">
                            <i class="bi bi-envelope"></i> Resend Verification
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
