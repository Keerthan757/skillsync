{% extends "base.html" %}
{% block title %}Register - SkillSync{% endblock %}

{% block content %}
<div class="py-5" style="background:linear-gradient(135deg,var(--primary) 0%,#7c3aed 50%,var(--secondary) 100%);min-height:80vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-xl" style="border-radius:var(--radius-2xl);">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
                                 style="width:56px;height:56px;border-radius:var(--radius-xl);background:linear-gradient(135deg,var(--primary),var(--secondary));">
                                <i class="bi bi-person-plus text-white fs-4"></i>
                            </div>
                            <h3 class="fw-bold" style="color:var(--gray-900);">Create Account</h3>
                            <p class="text-muted small">Start exchanging skills today</p>
                        </div>

                        <form method="POST" action="{{ url_for('auth.register') }}">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" name="name"
                                       value="{{ name|default('') }}" required minlength="2"
                                       placeholder="John Doe">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email"
                                       value="{{ email|default('') }}" required
                                       placeholder="you@example.com">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                       required minlength="6"
                                       placeholder="Min. 6 characters">
                            </div>

                            <div class="mb-4">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password"
                                       name="confirm_password" required
                                       placeholder="Re-enter password">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2.5 mb-3" style="font-size:1rem;">
                                Create Account <i class="bi bi-arrow-right"></i>
                            </button>
                        </form>

                        <div class="text-center">
                            <p class="text-muted small mb-0">
                                Already have an account?
                                <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none" style="color:var(--primary);">Log in</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
